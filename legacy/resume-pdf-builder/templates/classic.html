<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - 简历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Heiti SC', 'Songti SC', 'Hiragino Sans GB',
                         'PingFang SC', 'Times New Roman', 'Georgia', serif;
            line-height: 1.8;
            color: #000;
            padding: 45px 55px;
            max-width: 210mm;
            margin: 0 auto;
            background: #fff;
            font-size: 12pt;
        }
        .header {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #000;
        }
        .name {
            font-size: 28pt;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .contact {
            font-size: 10pt;
            color: #333;
        }
        .contact span {
            margin: 0 12px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 14pt;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #999;
            color: #000;
        }
        .item {
            margin-bottom: 18px;
            page-break-inside: avoid;
        }
        .item-title {
            font-weight: bold;
            font-size: 12pt;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .item-subtitle {
            color: #444;
            font-size: 10pt;
            font-style: italic;
            margin-bottom: 6px;
        }
        .item-content {
            font-size: 10.5pt;
            text-align: justify;
        }
        ul {
            padding-left: 20px;
            margin-top: 6px;
        }
        li {
            margin-bottom: 4px;
        }
        p {
            margin-bottom: 8px;
        }
        strong {
            font-weight: bold;
        }
        @page {
            size: A4;
            margin: 20mm 15mm;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="name">{{ name }}</div>
        <div class="contact">
            {% if phone %}<span>☎ {{ phone }}</span>{% endif %}
            {% if email %}<span>✉ {{ email }}</span>{% endif %}
            {% if location %}<span>⌂ {{ location }}</span>{% endif %}
            {% if github %}<span>⌨ {{ github }}</span>{% endif %}
        </div>
    </div>

    {{ content | safe }}
</body>
</html>
