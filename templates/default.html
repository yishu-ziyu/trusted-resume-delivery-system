<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - 简历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Heiti SC', 'Songti SC', 'Hiragino Sans GB',
                         'PingFang SC', -apple-system, sans-serif;
            line-height: 1.6;
            color: #333;
            padding: 40px;
            max-width: 210mm;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 20px;
        }
        .name {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .contact {
            font-size: 14px;
            color: #666;
        }
        .contact span {
            margin: 0 10px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
            padding-left: 10px;
        }
        .item {
            margin-bottom: 15px;
        }
        .item-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .item-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .item-content {
            font-size: 14px;
            line-height: 1.7;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 5px;
        }
        @page {
            size: A4;
            margin: 20mm;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="name">{{ name }}</div>
        <div class="contact">
            <span>📱 {{ phone }}</span>
            <span>📧 {{ email }}</span>
            <span>📍 {{ location }}</span>
            {% if github %}<span>💻 {{ github }}</span>{% endif %}
        </div>
    </div>

    {{ content | safe }}
</body>
</html>
